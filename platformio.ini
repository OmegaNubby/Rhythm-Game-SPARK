; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi.git#feature/proton-picosdk-support
board = proton
framework = picosdk
monitor_speed = 115200

;audio stuff starts here
lib_ignore =
    no-OS-FatFS-SD-SPI-RPi-Pico

build_flags =
    -Ilib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/ff15/source
    -Ilib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/include
    -Ilib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/sd_driver                        
build_src_filter =
    +<*>
    -<../audio_test.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/ff15/source/ff.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/ff15/source/ffsystem.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/ff15/source/ffunicode.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/sd_driver/*.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/src/*.c>
    -<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/src/rtc.c>
;audio stuff ends here

[env:engine_test]
extends = env:proton
build_src_filter =
    +<*>
    -<audio/>
    -<chart.c>

[env:audio_test]
extends = env:proton
lib_ignore =
    no-OS-FatFS-SD-SPI-RPi-Pico
build_src_filter =
    -<*>
    +<audio/audio.c>
    +<audio/hw_config.c>
    +<../audio_test.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/ff15/source/ff.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/ff15/source/ffsystem.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/ff15/source/ffunicode.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/sd_driver/*.c>
    +<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/src/*.c>
    -<../lib/no-OS-FatFS-SD-SPI-RPi-Pico/FatFs_SPI/src/rtc.c>

[env:ui_test]
extends = env:proton
lib_ignore =
    no-OS-FatFS-SD-SPI-RPi-Pico
build_src_filter =
    -<*>
    +<ui/>
    +<../ui_test.c>